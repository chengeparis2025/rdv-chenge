<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prendre rendez‑vous – Chenge</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
      background: #f5f5f5;
    }
    .container {
      max-width: 600px;
      margin: auto;
      background: #fff;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
    }
    h1, h2 {
      text-align: center;
      color: #333;
    }
    p {
      margin-top: 0;
    }
    label {
      display: block;
      margin-top: 10px;
    }
    input[type="text"],
    input[type="tel"],
    input[type="email"],
    input[type="date"] {
      width: 100%;
      padding: 8px;
      margin-top: 5px;
      border-radius: 4px;
      border: 1px solid #ccc;
      box-sizing: border-box;
    }
    .slots {
      margin-top: 10px;
    }
    .slot-item {
      margin-bottom: 5px;
    }
    button {
      margin-top: 15px;
      padding: 10px;
      width: 100%;
      background-color: #4CAF50;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 1rem;
    }
    button:disabled {
      background-color: #ccc;
      cursor: default;
    }
    #message {
      margin-top: 15px;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Chenge</h1>
    <h2>Prendre rendez‑vous</h2>
    <p>Choisissez un créneau de 4 heures. Le coursier peut passer à tout moment dans cette plage, soyez donc disponible pendant toute la durée.</p>
    <label for="date">Sélectionnez une date (mardi au samedi)&nbsp;:</label>
    <input type="date" id="date" name="date" />
    <div class="slots" id="slots"></div>
    <label for="nom">Nom&nbsp;:</label>
    <input type="text" id="nom" name="nom" />
    <label for="prenom">Prénom&nbsp;:</label>
    <input type="text" id="prenom" name="prenom" />
    <label for="adresse">Adresse postale&nbsp;:</label>
    <input type="text" id="adresse" name="adresse" />
    <label for="telephone">Téléphone&nbsp;:</label>
    <input type="tel" id="telephone" name="telephone" />
    <label for="email">Adresse e‑mail&nbsp;:</label>
    <input type="email" id="email" name="email" />
    <button id="submit">Réserver</button>
    <div id="message"></div>
  </div>
  <script>
    // Initialise la date minimum (deux jours à l'avance)
    const dateInput = document.getElementById('date');
    const today = new Date();
    today.setDate(today.getDate() + 2);
    dateInput.min = today.toISOString().split('T')[0];

    const slotsDiv = document.getElementById('slots');
    const submitBtn = document.getElementById('submit');

    // Fonction pour vérifier si la date sélectionnée est entre mardi (2) et samedi (6)
    function isValidDay(date) {
      const day = date.getDay();
      return day >= 2 && day <= 6;
    }

    dateInput.addEventListener('change', () => {
      const selectedValue = dateInput.value;
      const messageDiv = document.getElementById('message');
      messageDiv.textContent = '';
      if (!selectedValue) {
        slotsDiv.innerHTML = '';
        return;
      }
      const date = new Date(selectedValue);
      if (!isValidDay(date)) {
        slotsDiv.innerHTML = '<p>Veuillez choisir une date du mardi au samedi.</p>';
        return;
      }
      slotsDiv.innerHTML = '<p>Chargement des créneaux...</p>';
      fetch('/api/slots?date=' + selectedValue)
        .then((res) => res.json())
        .then((data) => {
          if (!data || data.length === 0) {
            slotsDiv.innerHTML = '<p>Aucun créneau disponible.</p>';
          } else {
            let html = '<p>Choisissez un créneau de 4 h&nbsp;:</p>';
            data.forEach((slot, idx) => {
              const start = new Date(slot.start);
              const end = new Date(slot.end);
              const options = { hour: '2-digit', minute: '2-digit' };
              const label =
                start.toLocaleTimeString('fr-FR', options) +
                ' – ' +
                end.toLocaleTimeString('fr-FR', options);
              html +=
                '<div class="slot-item"><input type="radio" name="slot" id="slot' +
                idx +
                '" value="' +
                slot.start +
                '"><label for="slot' +
                idx +
                '">' +
                label +
                '</label></div>';
            });
            slotsDiv.innerHTML = html;
          }
        })
        .catch(() => {
          slotsDiv.innerHTML = '<p>Erreur lors du chargement des créneaux.</p>';
        });
    });

    submitBtn.addEventListener('click', () => {
      const selectedSlot = document.querySelector('input[name="slot"]:checked');
      const nom = document.getElementById('nom').value.trim();
      const prenom = document.getElementById('prenom').value.trim();
      const adresse = document.getElementById('adresse').value.trim();
      const telephone = document.getElementById('telephone').value.trim();
      const email = document.getElementById('email').value.trim();
      const messageDiv = document.getElementById('message');
      messageDiv.textContent = '';
      if (
        !dateInput.value ||
        !selectedSlot ||
        !nom ||
        !prenom ||
        !adresse ||
        !telephone ||
        !email
      ) {
        messageDiv.textContent =
          'Merci de remplir tous les champs et de choisir un créneau.';
        messageDiv.style.color = 'red';
        return;
      }
      const body = {
        date: dateInput.value,
        start: selectedSlot.value,
        name: nom,
        prenom: prenom,
        adresse: adresse,
        telephone: telephone,
        email: email,
      };
      submitBtn.disabled = true;
      fetch('/api/reservations', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
      })
        .then((res) => res.json())
        .then((resp) => {
          if (resp.message) {
            messageDiv.textContent = resp.message;
            messageDiv.style.color = 'green';
            slotsDiv.innerHTML = '';
          } else if (resp.error) {
            messageDiv.textContent = resp.error;
            messageDiv.style.color = 'red';
          }
          submitBtn.disabled = false;
        })
        .catch(() => {
          messageDiv.textContent = 'Erreur lors de la réservation.';
          messageDiv.style.color = 'red';
          submitBtn.disabled = false;
        });
    });
  </script>
</body>
</html>
